
name: Contributions Update

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check random schedule
        id: schedule
        run: |
          python - <<'PY'
          import hashlib
          import os
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc)
          date = now.strftime("%Y-%m-%d")

          seed = hashlib.sha256(date.encode()).hexdigest()
          target_hour = int(seed[:8], 16) % 24

          should_run = now.hour == target_hour

          print(f"Target hour (UTC): {target_hour}")
          print(f"Current hour (UTC): {now.hour}")
          print(f"Should update: {should_run}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={str(should_run).lower()}\n")
          PY

      - name: Generate contributions SVG
        if: steps.schedule.outputs.run == 'true'
        run: python generate_contributions.py

      - name: Commit changes
        if: steps.schedule.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add contributions.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update contributions graph"
            git push
          else
            echo "No changes detected"
          fi
